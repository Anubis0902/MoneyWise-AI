name: 🗄️ DB Backup Health Check

# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT — How backups actually work
# ─────────────────────────────────────────────────────────────────────────────
# MoneyWise.db lives on Streamlit Community Cloud's ephemeral filesystem.
# GitHub Actions runners have NO access to the live Streamlit server, so
# this workflow CANNOT create new backups — it runs as a health-check instead.
#
# Backups are pushed by the LIVE app itself via two mechanisms:
#   1. utils/backup_trigger.py  — fires after every N DB writes (auto)
#   2. Sidebar "☁️ Backup Now" button — fires on demand (manual)
#
# This workflow:
#   • Downloads the latest backup from your backup repo via the GitHub API
#   • Validates it is a genuine SQLite file (checks magic bytes)
#   • Reports file size and the timestamp embedded in the latest commit message
#   • Exits with a non-zero code (→ email alert) if the backup is STALE
#     (no new backup in the last 48 hours)
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Run at 03:00 UTC daily — after overnight keep-alive pings
    - cron: "0 3 * * *"

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: db-backup-check
  cancel-in-progress: true

jobs:
  check:
    name: Validate Latest DB Backup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITHUB_TOKEN:    ${{ secrets.BACKUP_GITHUB_TOKEN }}
      GITHUB_REPO:     ${{ secrets.BACKUP_GITHUB_REPO }}
      GITHUB_DB_PATH:  MoneyWise.db
      GITHUB_BRANCH:   main
      # Max age (hours) before the check fails and GitHub sends an alert email
      STALE_HOURS:     48

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Validate backup & check freshness
        run: |
          python - <<'PYEOF'
          import base64, hashlib, os, sys, time
          import requests

          TOKEN    = os.environ["GITHUB_TOKEN"]
          REPO     = os.environ["GITHUB_REPO"]
          DB_PATH  = os.environ["GITHUB_DB_PATH"]
          BRANCH   = os.environ["GITHUB_BRANCH"]
          MAX_AGE  = int(os.environ.get("STALE_HOURS", 48)) * 3600

          HEADERS = {
              "Authorization": f"token {TOKEN}",
              "Accept":        "application/vnd.github.v3+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          # ── 1. Fetch file info ───────────────────────────────────────────────
          url  = f"https://api.github.com/repos/{REPO}/contents/{DB_PATH}"
          resp = requests.get(url, headers=HEADERS, params={"ref": BRANCH}, timeout=30)

          if resp.status_code == 404:
              print("❌  No backup found in the backup repository.")
              print(f"   Repo: {REPO}  |  Path: {DB_PATH}  |  Branch: {BRANCH}")
              print("   Trigger a backup by clicking '☁️ Backup Now' in the app sidebar.")
              sys.exit(1)

          if resp.status_code != 200:
              print(f"❌  GitHub API error {resp.status_code}: {resp.text[:300]}")
              sys.exit(1)

          info = resp.json()
          file_size_bytes = info.get("size", 0)
          sha_short       = info.get("sha", "")[:7]
          print(f"✅  Backup file found")
          print(f"   Repo      : {REPO}/{DB_PATH}  (branch: {BRANCH})")
          print(f"   Size      : {file_size_bytes:,} bytes  ({file_size_bytes/1024:.1f} KB)")
          print(f"   Blob SHA  : {sha_short}")

          # ── 2. Validate SQLite magic bytes ───────────────────────────────────
          SQLITE_MAGIC = b"SQLite format 3\x00"
          db_bytes = base64.b64decode(info["content"])
          if db_bytes[:16] != SQLITE_MAGIC:
              print("❌  Backup is NOT a valid SQLite file (magic bytes mismatch)!")
              print(f"   Got: {db_bytes[:16]!r}")
              sys.exit(1)
          sha256 = hashlib.sha256(db_bytes).hexdigest()
          print(f"✅  SQLite magic bytes OK")
          print(f"   SHA-256   : {sha256[:16]}…")

          # ── 3. Check backup freshness via latest commit on this file ─────────
          commits_url  = f"https://api.github.com/repos/{REPO}/commits"
          commits_resp = requests.get(
              commits_url,
              headers=HEADERS,
              params={"path": DB_PATH, "sha": BRANCH, "per_page": 1},
              timeout=30,
          )
          if commits_resp.status_code == 200 and commits_resp.json():
              latest = commits_resp.json()[0]
              commit_date_str = latest["commit"]["committer"]["date"]  # ISO-8601 UTC
              # Parse manually (no dateutil in CI)
              from datetime import datetime, timezone
              commit_dt  = datetime.fromisoformat(commit_date_str.replace("Z", "+00:00"))
              now_dt     = datetime.now(tz=timezone.utc)
              age_seconds = (now_dt - commit_dt).total_seconds()
              age_hours   = age_seconds / 3600
              print(f"   Last commit : {commit_date_str}  ({age_hours:.1f} h ago)")

              if age_seconds > MAX_AGE:
                  print(
                      f"⚠️  STALE BACKUP — last backup was {age_hours:.1f} h ago "
                      f"(threshold: {MAX_AGE/3600:.0f} h)."
                  )
                  print("   Action: open the app and click '☁️ Backup Now' in the sidebar.")
                  sys.exit(1)
              else:
                  print(f"✅  Backup is fresh ({age_hours:.1f} h old < {MAX_AGE/3600:.0f} h threshold)")
          else:
              print("⚠️  Could not retrieve commit history — skipping freshness check.")

          print("\n🎉  All checks passed. DB backup is healthy.")
          PYEOF

      - name: Log check timestamp
        if: always()
        run: echo "Health check completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
